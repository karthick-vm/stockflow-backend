services:
  app:
    image: stockflow:latest
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1612
      POSTGRES_DB: stockflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

volumes:
  postgres_data: